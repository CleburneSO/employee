<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cleburne County Sheriff's Office — Employee Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=20261112a">
  <link rel="stylesheet" href="theme.css?v=20261112a">
  <script>
    // Light / dark: the person's choice if they made one; dark otherwise
    (function () {
      var t = null; try { t = localStorage.getItem('portal_theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" href="seal.png">
  <!-- Add to home screen: opens full-screen like an app, with the seal as its icon -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CCSO Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#41512c">
</head>
<body>
  <div id="app"><div class="loading">Loading…</div></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20261112a"></script>
  <script src="app.js?v=20261112a"></script>
</body>
</html>
